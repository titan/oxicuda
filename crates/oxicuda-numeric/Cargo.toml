[package]
name = "oxicuda-numeric"
description = "OxiCUDA: Numerical analysis primitives (root finding, quadrature, ODEs, special functions, interpolation, polynomial roots, multi-D cubature)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[features]
# Enables on-device GPU tests that JIT-compile the hand-written PTX kernels,
# launch them on a real CUDA device, and assert numerical equivalence to an
# independent CPU oracle. The tests skip gracefully when no GPU is present, so
# this feature is safe to enable on CPU-only machines.
gpu-tests = []

[dependencies]
thiserror.workspace = true
num-complex.workspace = true

[dev-dependencies]
criterion.workspace = true
oxicuda-driver = { path = "../oxicuda-driver" }
oxicuda-memory = { path = "../oxicuda-memory" }
oxicuda-launch = { path = "../oxicuda-launch" }

[lints]
workspace = true

[[bench]]
name = "numeric_ops"
harness = false
