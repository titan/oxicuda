[package]
name = "oxicuda-evol"
description = "Evolutionary & Genetic Algorithms for OxiCUDA — CMA-ES, NSGA-II, NEAT, DE, PSO, ACO, multi-objective optimization, neuroevolution"
version.workspace = true
edition.workspace = true
authors.workspace = true
readme = "README.md"
license.workspace = true
homepage = "https://github.com/cool-japan/oxicuda"
repository.workspace = true
keywords = ["gpu", "evolutionary", "cma-es", "nsga2", "pure-rust"]
categories = ["science", "algorithms"]

[lints]
workspace = true

[features]
# On-device PTX validation harness (`src/gpu_tests.rs`). Requires a CUDA device.
gpu-tests = []

[dependencies]
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
oxicuda-driver = { path = "../oxicuda-driver" }
oxicuda-memory = { path = "../oxicuda-memory" }
oxicuda-launch = { path = "../oxicuda-launch" }

[[bench]]
name = "evol_ops"
harness = false

[[bench]]
name = "algo_bench"
harness = false
