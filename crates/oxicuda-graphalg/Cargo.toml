[package]
name = "oxicuda-graphalg"
description = "OxiCUDA: Classical graph algorithms (BFS/DFS, shortest paths, MST, max-flow, matching, SCC, centrality, community, TSP, coloring, isomorphism)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
thiserror.workspace = true

[features]
# On-device GPU validation harness for the hand-written PTX kernels.
# Enable with `--features gpu-tests` on a machine with a CUDA device.
gpu-tests = []

[dev-dependencies]
criterion.workspace = true
oxicuda-driver = { workspace = true }
oxicuda-memory = { workspace = true }
oxicuda-launch = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "graphalg_ops"
harness = false
