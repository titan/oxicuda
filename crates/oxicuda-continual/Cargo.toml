[package]
name = "oxicuda-continual"
description = "Continual and lifelong learning primitives for OxiCUDA: EWC/SI/MAS regularization, PackNet/Piggyback/Progressive architectures, Experience Replay/GEM/A-GEM, DER++, forgetting metrics — pure Rust, zero CUDA SDK dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["gpu", "continual-learning", "lifelong", "ewc", "forgetting"]
categories = ["science", "algorithms"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
# On-device PTX validation harness (src/gpu_tests.rs). Requires a real CUDA
# device; tests skip gracefully when none is present.
gpu-tests = []

[dependencies]
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
oxicuda-driver = { path = "../oxicuda-driver" }
oxicuda-memory = { path = "../oxicuda-memory" }
oxicuda-launch = { path = "../oxicuda-launch" }

[[bench]]
name = "continual_ops"
harness = false
