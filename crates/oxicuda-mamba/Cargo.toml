[package]
name         = "oxicuda-mamba"
description  = "State Space Model primitives for OxiCUDA: S4 (HiPPO-LegS / DPLR), Mamba selective scan (S6), Mamba-2 (SSD), and RWKV time-mixing — pure Rust, zero CUDA SDK dependency."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme                 = "README.md"
keywords = ["gpu", "ssm", "mamba", "rwkv", "state-space"]
categories = ["science", "algorithms"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name    = "mamba_ops"
harness = false
