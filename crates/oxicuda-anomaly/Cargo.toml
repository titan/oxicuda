[package]
name = "oxicuda-anomaly"
description = "Anomaly detection primitives for OxiCUDA — DeepSVDD, AE/VAE reconstruction, LOF, COPOD, isolation scoring, statistical methods, ensemble"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage = "https://github.com/cool-japan/oxicuda"
repository.workspace = true
readme = "README.md"
keywords = ["gpu", "anomaly-detection", "outlier", "deep-learning", "pure-rust"]
categories = ["science", "algorithms"]

[lints]
workspace = true

[features]
# Enables on-device GPU tests that JIT-compile the hand-written PTX kernels,
# launch them on a real CUDA device, and assert numerical equivalence to the
# crate's CPU references. The tests skip gracefully when no GPU is present.
gpu-tests = []

[dependencies]
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
oxicuda-driver = { path = "../oxicuda-driver" }
oxicuda-memory = { path = "../oxicuda-memory" }
oxicuda-launch = { path = "../oxicuda-launch" }

[[bench]]
name = "anomaly_ops"
harness = false
