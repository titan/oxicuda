[package]
name = "oxicuda-tabular"
description = "Tabular deep learning primitives for OxiCUDA — TabNet, FT-Transformer, SAINT, NODE, sparsemax, quantile normalization"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage = "https://github.com/cool-japan/oxicuda"
repository.workspace = true
readme = "README.md"
keywords = ["gpu", "tabular", "tabnet", "deep-learning", "pure-rust"]
categories = ["science", "algorithms"]

[lints]
workspace = true

[features]
# Enables on-device GPU tests that JIT-compile the hand-written PTX kernels,
# launch them on a real CUDA device, and assert numerical equivalence to the
# crate's CPU references. The tests skip gracefully when no GPU is present, so
# this feature is safe to enable on CPU-only machines.
gpu-tests = []

[dependencies]
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
oxicuda-driver = { workspace = true }
oxicuda-memory = { workspace = true }
oxicuda-launch = { workspace = true }

[[bench]]
name = "tabular_ops"
harness = false
