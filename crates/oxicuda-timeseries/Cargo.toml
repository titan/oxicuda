[package]
name         = "oxicuda-timeseries"
description  = "Time-series forecasting & classification for OxiCUDA: TCN, NHiTS, PatchTST, TimesNet, iTransformer, RevIN, series decomposition — pure Rust, zero CUDA SDK dependency."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme                 = "README.md"
keywords = ["gpu", "time-series", "forecasting", "transformer", "tcn"]
categories = ["science", "algorithms"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name    = "ts_ops"
harness = false
