[package]
name         = "oxicuda-gen"
description  = "Generative AI primitives for OxiCUDA: diffusion schedulers (DDPM/DDIM/DPM-Solver++/Flow Matching), classifier-free guidance, VAE codec, LoRA adapters, and score network building blocks — pure Rust, zero CUDA SDK dependency."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme                 = "README.md"
keywords = ["gpu", "diffusion", "generative-ai", "lora", "vae"]
categories = ["science", "algorithms"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "gen_ops"
harness = false
