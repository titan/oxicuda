[package]
name = "oxicuda-snn"
description = "Spiking Neural Network primitives for OxiCUDA — LIF, IF, Izhikevich, AdEx, Poisson neurons; surrogate gradients (sigmoid/atan/triangle/super-spike/fast-sigmoid); BPTT/STBP/SLAYER training; STDP/R-STDP/triplet plasticity; ANN→SNN conversion; rate/TTFS/phase encodings; spiking layers and reservoirs; van Rossum/Victor-Purpura metrics"
version.workspace = true
edition.workspace = true
authors.workspace = true
readme = "README.md"
license.workspace = true
homepage = "https://github.com/cool-japan/oxicuda"
repository.workspace = true
keywords = ["gpu", "spiking", "snn", "neuromorphic", "pure-rust"]
categories = ["science", "algorithms"]

[lints]
workspace = true

[features]
# Enables on-device GPU tests that JIT-compile the hand-written PTX kernels,
# launch them on a real CUDA device, and assert numerical equivalence to the
# crate's CPU references. The tests skip gracefully when no GPU is present, so
# this feature is safe to enable on CPU-only machines.
gpu-tests = []

[dependencies]
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
oxicuda-driver = { workspace = true }
oxicuda-memory = { workspace = true }
oxicuda-launch = { workspace = true }

[[bench]]
name = "snn_ops"
harness = false
