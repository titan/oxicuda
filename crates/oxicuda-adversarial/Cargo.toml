[package]
name         = "oxicuda-adversarial"
description  = "Adversarial robustness primitives for OxiCUDA: FGSM, PGD, MIM, CW, AutoPGD attacks; TRADES, MART, randomized smoothing, certified bounds — pure Rust, zero CUDA SDK dependency."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme                 = "README.md"
keywords = ["gpu", "adversarial", "robustness", "security", "ml"]
categories = ["science", "algorithms"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name    = "adv_ops"
harness = false
