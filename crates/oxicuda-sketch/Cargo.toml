[package]
name = "oxicuda-sketch"
description = "OxiCUDA: Streaming data sketches and sublinear algorithms (HLL, CMS, Bloom, KLL, t-Digest, MinHash, LSH, Reservoir)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[features]
# Enables on-device GPU tests that JIT-compile the hand-written PTX kernels,
# launch them on a real CUDA device, and assert numerical equivalence to an
# independent host re-derivation of each kernel's documented arithmetic. The
# tests skip gracefully when no GPU is present, so this feature is safe to
# enable on CPU-only machines.
gpu-tests = []

[dependencies]
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
oxicuda-driver = { workspace = true }
oxicuda-memory = { workspace = true }
oxicuda-launch = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "sketch_ops"
harness = false
