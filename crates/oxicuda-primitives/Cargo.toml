[package]
name = "oxicuda-primitives"
description = "OxiCUDA Primitives - CUB-equivalent parallel GPU primitives (radix sort, scan, reduce, select, histogram)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["cuda", "gpu", "parallel", "sort", "primitives"]
categories = ["hardware-support", "science", "mathematics", "algorithms"]

[features]
# Enables on-device GPU tests that JIT-compile the generated PTX kernels, launch
# them on a real CUDA device, and assert numerical equivalence to a CPU oracle.
# The tests skip gracefully when no GPU is present, so this feature is safe to
# enable on CPU-only machines.
gpu-tests = []

[dependencies]
oxicuda-driver = { workspace = true }
oxicuda-memory = { workspace = true }
oxicuda-launch = { workspace = true }
oxicuda-ptx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
approx = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
