[package]
name         = "oxicuda-federated"
description  = "Federated learning primitives for OxiCUDA: FedAvg/FedProx/SCAFFOLD/FedAdam, differential privacy, secure aggregation, communication compression — pure Rust, zero CUDA SDK dependency."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme                 = "README.md"
keywords = ["gpu", "federated-learning", "diff-privacy", "secure-aggregation", "distributed"]
categories = ["science", "algorithms"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
# On-device GPU validation of the hand-written PTX kernels. Enables the
# `gpu_tests` module (JIT-load each kernel on the live CUDA device, launch it,
# and compare against a CPU oracle). No-op on machines without a CUDA device.
gpu-tests = []

[dependencies]
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
oxicuda-driver = { workspace = true }
oxicuda-memory = { workspace = true }
oxicuda-launch = { workspace = true }

[[bench]]
name    = "fed_ops"
harness = false
