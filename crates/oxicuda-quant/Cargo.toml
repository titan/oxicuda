[package]
name = "oxicuda-quant"
description = "GPU-accelerated quantization and model compression engine for OxiCUDA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["gpu", "quantization", "compression", "cuda", "deep-learning"]
categories = ["science", "algorithms"]

[dependencies]
oxicuda-driver = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
num-traits     = { workspace = true }

[features]
# On-device GPU validation of the hand-written PTX kernels.  Enabling this
# turns on the `gpu_tests` module, which JIT-loads each kernel on a live CUDA
# device and compares its output to the crate's CPU reference.
gpu-tests = []

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
oxicuda-driver = { path = "../oxicuda-driver" }
oxicuda-memory = { path = "../oxicuda-memory" }
oxicuda-launch = { path = "../oxicuda-launch" }

[[bench]]
name = "quant_ops"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
