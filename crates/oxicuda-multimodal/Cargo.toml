[package]
name         = "oxicuda-multimodal"
description  = "Multi-modal learning primitives for OxiCUDA: cross-modal attention, CLIP alignment, bilinear fusion, BERT/ViT/Conformer/temporal encoders — pure Rust, zero CUDA SDK dependency."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme                 = "README.md"
keywords = ["gpu", "multimodal", "vision-language", "clip", "attention"]
categories = ["science", "algorithms"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
# Enables on-device GPU tests that JIT-compile the hand-written PTX kernels,
# launch them on a real CUDA device, and assert numerical equivalence to the
# crate's CPU references.  Tests skip gracefully when no GPU is present, so
# this feature is safe to enable on CPU-only machines.
gpu-tests = []

[dependencies]
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
oxicuda-driver = { workspace = true }
oxicuda-memory = { workspace = true }
oxicuda-launch = { workspace = true }

[[bench]]
name    = "mm_ops"
harness = false
