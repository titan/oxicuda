[package]
name = "oxicuda-recsys"
description = "Recommender-system primitives for OxiCUDA — ALS/BPR/NMF, NCF, Two-Tower, DeepFM/AutoInt, SASRec/BERT4Rec, LightGCN/NGCF, MMoE/PLE/ESMM, negative sampling, ranking metrics"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage = "https://github.com/cool-japan/oxicuda"
repository.workspace = true
readme = "README.md"
keywords = ["gpu", "recommender", "collab-filtering", "neural-network", "pure-rust"]
categories = ["science", "algorithms"]

[lints]
workspace = true

[features]
# Enables on-device GPU tests that JIT-compile the hand-written PTX kernels,
# launch them on a real CUDA device, and assert numerical equivalence or
# structural correctness against CPU references. Tests skip gracefully when
# no GPU is present, so this feature is safe to enable on CPU-only machines.
gpu-tests = []

[dependencies]
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
oxicuda-driver = { workspace = true }
oxicuda-memory = { workspace = true }
oxicuda-launch = { workspace = true }

[[bench]]
name = "recsys_ops"
harness = false
