[package]
name = "oxicuda-nerf"
description = "Neural Radiance Fields and neural rendering primitives for OxiCUDA — NeRF, Instant-NGP hash grid, Mip-NeRF, TensoRF, volume rendering"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gpu", "nerf", "radiance-fields", "3d", "pure-rust"]
categories = ["science", "algorithms"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

[features]
# On-device GPU PTX validation harness (src/gpu_tests.rs). Off by default so the
# crate builds without a CUDA toolkit; enable with `--features gpu-tests`.
gpu-tests = []

[dev-dependencies]
criterion.workspace = true
oxicuda-driver = { path = "../oxicuda-driver" }
oxicuda-memory = { path = "../oxicuda-memory" }
oxicuda-launch = { path = "../oxicuda-launch" }

[[bench]]
name = "nerf_ops"
harness = false
