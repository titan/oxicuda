[package]
name = "oxicuda-ann"
description = "Approximate Nearest Neighbor & vector-search primitives for OxiCUDA — HNSW, IVF, Product Quantization, IVFPQ, LSH, k-NN graph, top-K selection"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage = "https://github.com/cool-japan/oxicuda"
repository.workspace = true
readme = "README.md"
keywords = ["gpu", "ann", "nearest-neighbor", "hnsw", "pure-rust"]
categories = ["algorithms", "science"]

[lints]
workspace = true

[features]
# Enables on-device GPU tests that JIT-compile the hand-written PTX kernels,
# launch them on a real CUDA device, and assert numerical equivalence to the
# crate's CPU references. The tests skip gracefully when no GPU is present, so
# this feature is safe to enable on CPU-only machines.
gpu-tests = []

[dependencies]
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
oxicuda-driver = { path = "../oxicuda-driver" }
oxicuda-memory = { path = "../oxicuda-memory" }
oxicuda-launch = { path = "../oxicuda-launch" }

[[bench]]
name = "ann_ops"
harness = false
