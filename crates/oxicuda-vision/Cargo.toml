[package]
name         = "oxicuda-vision"
description  = "Vision Transformer & CLIP primitives for OxiCUDA: ViT patch embedding, multi-head self-attention, CLIP contrastive learning, FPN, RoI align, DETR decoder — pure Rust, zero CUDA SDK dependency."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme                 = "README.md"
keywords = ["gpu", "vision", "vit", "clip", "transformer"]
categories = ["science", "algorithms"]

[features]
gpu-tests = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
oxicuda-driver  = { path = "../oxicuda-driver" }
oxicuda-memory  = { path = "../oxicuda-memory" }
oxicuda-launch  = { path = "../oxicuda-launch" }

[[bench]]
name    = "vision_ops"
harness = false
