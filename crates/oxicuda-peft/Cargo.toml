[package]
name = "oxicuda-peft"
description = "Parameter-Efficient Fine-Tuning primitives for OxiCUDA — LoRA, QLoRA, AdaLoRA, DoRA, IA³, Prefix-Tuning, P-Tuning v2, Prompt-Tuning, Houlsby/Pfeiffer/Parallel adapters, BitFit, Diff-Pruning"
version.workspace = true
edition.workspace = true
authors.workspace = true
readme = "README.md"
license.workspace = true
homepage = "https://github.com/cool-japan/oxicuda"
repository.workspace = true
keywords = ["gpu", "peft", "lora", "fine-tuning", "pure-rust"]
categories = ["science", "algorithms"]

[lints]
workspace = true

[features]
# Enables on-device GPU tests that JIT-compile the hand-written PTX kernels,
# launch them on a real CUDA device, and assert numerical equivalence to the
# crate's CPU references. The tests skip gracefully when no GPU is present, so
# this feature is safe to enable on CPU-only machines.
gpu-tests = []

[dependencies]
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
oxicuda-driver = { workspace = true }
oxicuda-memory = { workspace = true }
oxicuda-launch = { workspace = true }

[[bench]]
name = "peft_ops"
harness = false
