[package]
name         = "oxicuda-gnn"
description  = "Graph Neural Network primitives for OxiCUDA: sparse graph representations (CSR/COO/heterogeneous), message passing framework, GCN/GAT/GraphSAGE/GIN layers, global and hierarchical graph pooling — pure Rust, zero CUDA SDK dependency."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme                 = "README.md"
keywords = ["gpu", "graph-neural-net", "gnn", "gcn", "message-passing"]
categories = ["science", "algorithms"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
oxicuda-sparse = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "gnn_ops"
harness = false
